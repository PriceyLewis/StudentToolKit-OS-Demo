name: Refresh portfolio screenshot

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "context/**"
      - "src/**"
      - "assets/**"
      - "app.json"
      - "app.config.js"
      - ".github/workflows/portfolio-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: student-toolkit-portfolio-screenshot
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web app
        run: npx expo export --platform web --output-dir dist

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/student-toolkit-http.log 2>&1 &
          echo $! > /tmp/student-toolkit-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/student-toolkit-http.log
          exit 1

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture real onboarding UI
        run: |
          mkdir -p docs/screenshots
          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,1000"             --full-page             http://127.0.0.1:4173/             docs/screenshots/student-toolkit-onboarding.png

      - name: Commit screenshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/student-toolkit-dashboard.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh Student Toolkit UI screenshot [skip ci]"
          git pull --rebase origin main
          git push
