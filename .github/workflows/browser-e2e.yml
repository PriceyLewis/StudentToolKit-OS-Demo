name: Browser journeys

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export production GitHub Pages build
        env:
          GITHUB_PAGES: "1"
        run: npx expo export --platform web --output-dir dist

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise portfolio and planner journeys
        run: |
          rm -rf test-site
          mkdir -p test-site/StudentToolKit-OS-Demo
          cp -R dist/. test-site/StudentToolKit-OS-Demo/
          python3 -m http.server 4173 --directory test-site >/tmp/student-toolkit-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/StudentToolKit-OS-Demo/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const { chromium } = require('playwright');

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          async function assertChartFits(page) {
            // Expo Router keeps previous routes mounted on web, so there can be
            // hidden dashboard charts in the DOM after navigating to Analytics.
            // Always measure the currently rendered graph rather than .first().
            const graph = page.locator('[data-testid="performance-graph"]:visible').first();
            await graph.waitFor({ state: 'visible' });
            const svg = graph.locator('svg').first();
            await svg.waitFor({ state: 'attached' });
            await page.waitForFunction(() => {
              const graphs = Array.from(document.querySelectorAll('[data-testid="performance-graph"]'));
              const graph = graphs.find(element => {
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return rect.width > 0 &&
                  rect.height > 0 &&
                  style.display !== 'none' &&
                  style.visibility !== 'hidden';
              });
              const svg = graph?.querySelector('svg');
              if (!graph || !svg) return false;
              const graphRect = graph.getBoundingClientRect();
              const svgRect = svg.getBoundingClientRect();
              return svgRect.width > 0 &&
                svgRect.height > 0 &&
                Math.abs(graphRect.width - svgRect.width) <= 2;
            });
            const layout = await graph.evaluate(element => {
              const svg = element.querySelector('svg');
              const graphRect = element.getBoundingClientRect();
              const svgRect = svg.getBoundingClientRect();
              const graphStyle = getComputedStyle(element);
              const svgStyle = getComputedStyle(svg);
              return {
                cardWidth: graphRect.width,
                cardHeight: graphRect.height,
                chartWidth: svgRect.width,
                chartHeight: svgRect.height,
                graphDisplay: graphStyle.display,
                graphVisibility: graphStyle.visibility,
                svgDisplay: svgStyle.display,
                svgVisibility: svgStyle.visibility,
                viewport: innerWidth,
                documentWidth: document.documentElement.scrollWidth,
              };
            });
            assert(layout.cardWidth > 0 && layout.cardHeight > 0, 'Chart card has no rendered size: ' + JSON.stringify(layout));
            assert(layout.chartWidth > 0 && layout.chartHeight > 0, 'Chart SVG has no rendered size: ' + JSON.stringify(layout));
            assert(layout.graphDisplay !== 'none' && layout.graphVisibility !== 'hidden', 'Chart card is hidden: ' + JSON.stringify(layout));
            assert(layout.svgDisplay !== 'none' && layout.svgVisibility !== 'hidden', 'Chart SVG is hidden: ' + JSON.stringify(layout));
            assert(Math.abs(layout.cardWidth - layout.chartWidth) <= 2, 'Chart does not fill its card: ' + JSON.stringify(layout));
            assert(layout.documentWidth <= layout.viewport + 2, 'Analytics overflows viewport: ' + JSON.stringify(layout));
          }

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();
            const base = 'http://127.0.0.1:4173/StudentToolKit-OS-Demo/';

            const runtimeErrors = [];
            page.on('pageerror', error => runtimeErrors.push(error.message));
            page.on('console', msg => {
              if (msg.type() === 'error' && !/favicon|ResizeObserver loop/i.test(msg.text())) {
                runtimeErrors.push(msg.text());
              }
            });
            page.on('dialog', dialog => dialog.accept());

            await page.goto(base, { waitUntil: 'networkidle' });
            await page.getByText('Student Toolkit OS').waitFor();

            // Build a normal local workspace first.
            await page.getByPlaceholder('Your name').fill('Audit User');
            await page.getByPlaceholder(/Primary focus/).fill('Portfolio QA');
            await page.getByText('Create My Dashboard', { exact: true }).click();
            await page.getByText(/Welcome.*Audit User/i).waitFor({ timeout: 30000 });

            // Enter demo mode from an existing workspace and verify sample data appears.
            await page.getByText('Load interactive portfolio demo', { exact: true }).click();
            await page.getByText(/Welcome back, Alex/i).waitFor({ timeout: 30000 });
            await page.getByText('Academic Performance', { exact: true }).waitFor();

            const routes = [
              ['Academic Performance', 'Adaptive Revision Scheduler'],
              ['Physical Conditioning', 'Physical Conditioning Planner'],
              ['Income Development', 'Income Development Planner'],
              ['Professional Profile', 'Professional Profile Planner'],
              ['Edit Targets', 'Performance Targets'],
              ['Manage Habits', 'Manage Habits'],
            ];

            for (const [buttonText, destinationText] of routes) {
              const locator = page.getByText(buttonText, { exact: true }).last();
              await locator.click();
              await page.getByText(destinationText, { exact: true }).last().waitFor({ timeout: 30000 });
              await page.goBack({ waitUntil: 'domcontentloaded' });
              await page.getByText('Academic Performance', { exact: true }).waitFor({ timeout: 30000 });
            }

            await page.getByText('Open Weekly Review', { exact: true }).click();
            await page.waitForURL(/\/weekly-review\/?$/, { timeout: 30000 });
            await page.getByText('Last 7 days compared to the previous 7 days', { exact: true }).waitFor({ timeout: 30000 });
            await page.goBack({ waitUntil: 'domcontentloaded' });
            await page.getByText('Academic Performance', { exact: true }).waitFor();

            await page.getByText('Analytics', { exact: true }).first().click();
            await page.waitForURL(/\/analytics\/?$/, { timeout: 30000 });
            await page.getByText('Trends and consistency', { exact: true }).waitFor({ timeout: 30000 });
            assert(/Trends and consistency/i.test(await page.locator('body').innerText()), 'Analytics content missing');
            await assertChartFits(page);
            await page.screenshot({ path: 'analytics-desktop.png', fullPage: true });
            await page.setViewportSize({ width: 768, height: 900 });
            await assertChartFits(page);
            await page.setViewportSize({ width: 1280, height: 900 });
            await assertChartFits(page);
            await page.goBack({ waitUntil: 'domcontentloaded' });
            await page.getByText('Academic Performance', { exact: true }).waitFor();

            // Backup export must use browser downloads, and invalid imports must
            // leave the currently active demo intact.
            const badChooser = page.waitForEvent('filechooser');
            await page.getByText('Restore backup', { exact: true }).click();
            const invalidRestore = page.waitForEvent('dialog', { predicate: dialog => dialog.message().includes('Restore failed') });
            await (await badChooser).setFiles({ name: 'invalid.json', mimeType: 'application/json', buffer: Buffer.from('{broken') });
            await invalidRestore;
            await page.getByText(/Welcome back, Alex/i).waitFor();
            assert(await page.getByText(/Interactive portfolio demo is active/).isVisible(), 'Invalid restore exited the demo');

            // Exit demo and prove the pre-demo profile returns.
            await page.getByText('Exit demo & restore previous data', { exact: true }).click();
            await page.getByText(/Welcome.*Audit User/i).waitFor({ timeout: 30000 });
            await page.waitForTimeout(900);

            const downloadPromise = page.waitForEvent('download');
            await page.getByText('Export backup (JSON)', { exact: true }).click();
            const backup = await downloadPromise;
            const backupPath = await backup.path();
            const backupData = JSON.parse(require('fs').readFileSync(backupPath, 'utf8'));
            assert(backupData.app === 'student-toolkit' && backupData.data.profileData, 'Backup does not contain the workspace');
            await page.getByText('Edit Targets', { exact: true }).click();
            await page.getByLabel('Academic deadline', { exact: true }).fill('2027-06-15');
            await page.reload({ waitUntil: 'networkidle' });
            assert(await page.getByLabel('Academic deadline', { exact: true }).inputValue() === '2027-06-15', 'Deadline did not persist');
            await page.getByRole('button', { name: 'Dashboard', exact: true }).click();
            const chooserPromise = page.waitForEvent('filechooser');
            await page.getByText('Restore backup', { exact: true }).click();
            const restored = page.waitForEvent('dialog', { predicate: dialog => dialog.message().includes('Backup restored') });
            await (await chooserPromise).setFiles(backupPath);
            await restored;
            await page.getByText(/Welcome.*Audit User/i).waitFor();
            await page.getByText('Edit Targets', { exact: true }).click();
            assert(await page.getByLabel('Academic deadline', { exact: true }).inputValue() === '', 'Backup did not restore the original deadline');
            await page.getByRole('button', { name: 'Dashboard', exact: true }).click();

            assert(runtimeErrors.length === 0, 'Browser runtime errors: ' + runtimeErrors.join(' | '));
            await page.screenshot({ path: 'student-toolkit-browser-audit.png', fullPage: true });
            await context.close();

            // Mobile visual + route regression against the same production export.
            const mobileContext = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const mobile = await mobileContext.newPage();
            const mobileErrors = [];
            mobile.on('pageerror', error => mobileErrors.push(error.message));
            mobile.on('console', msg => {
              if (msg.type() === 'error' && !/favicon|ResizeObserver loop/i.test(msg.text())) {
                mobileErrors.push(msg.text());
              }
            });
            mobile.on('dialog', dialog => dialog.accept());

            await mobile.goto(base, { waitUntil: 'networkidle' });
            await mobile.getByText('Try Interactive Demo', { exact: true }).click();
            await mobile.getByText('Academic Performance', { exact: true }).waitFor({ timeout: 30000 });

            await mobile.getByRole('button', { name: 'Analytics', exact: true }).click();
            await mobile.getByText('Trends and consistency', { exact: true }).waitFor();
            await assertChartFits(mobile);
            await mobile.screenshot({ path: 'analytics-mobile.png', fullPage: true });
            await mobile.setViewportSize({ width: 320, height: 740 });
            await assertChartFits(mobile);
            await mobile.setViewportSize({ width: 390, height: 844 });
            await mobile.goBack({ waitUntil: 'domcontentloaded' });
            await mobile.getByText('Academic Performance', { exact: true }).waitFor();

            let mobileLayout = await mobile.evaluate(() => ({
              viewport: innerWidth,
              documentWidth: document.documentElement.scrollWidth,
            }));
            assert(
              mobileLayout.documentWidth <= mobileLayout.viewport + 2,
              'Student Toolkit dashboard overflows mobile viewport: ' + JSON.stringify(mobileLayout)
            );

            await mobile.getByText('Academic Performance', { exact: true }).last().click();
            await mobile.waitForURL(/\/revision\/?$/, { timeout: 30000 });
            await mobile.getByText('Adaptive Revision Scheduler', { exact: true }).waitFor({ timeout: 30000 });
            mobileLayout = await mobile.evaluate(() => ({
              viewport: innerWidth,
              documentWidth: document.documentElement.scrollWidth,
            }));
            assert(
              mobileLayout.documentWidth <= mobileLayout.viewport + 2,
              'Revision planner overflows mobile viewport: ' + JSON.stringify(mobileLayout)
            );

            await mobile.goBack({ waitUntil: 'domcontentloaded' });
            await mobile.getByText('Manage Habits', { exact: true }).last().click();
            await mobile.waitForURL(/\/habits\/?$/, { timeout: 30000 });
            await mobile.getByText('Create, edit, categorize, and archive habits.', { exact: true }).waitFor({ timeout: 30000 });

            await mobile.goBack({ waitUntil: 'domcontentloaded' });
            await mobile.getByRole('button', { name: 'Settings', exact: true }).click();
            await mobile.setViewportSize({ width: 320, height: 568 });
            await mobile.getByText('Terms of use', { exact: true }).click();
            await mobile.goBack({ waitUntil: 'domcontentloaded' });
            await mobile.getByText('Scheduled reminders are available in the Android and iOS app.', { exact: true }).waitFor();
            assert(await mobile.getByRole('switch', { name: 'Daily reminder' }).isDisabled(), 'Web reminder must be explicitly unavailable');
            for (const theme of ['Dark', 'Midnight', 'Clean Light']) {
              await mobile.getByText(theme, { exact: true }).click();
              await mobile.getByRole('button', { name: 'Analytics', exact: true }).click();
              await assertChartFits(mobile);
              const label = mobile.locator('[data-testid="performance-graph"]:visible').first().locator('svg text').first();
              const fill = await label.getAttribute('fill');
              const expected = theme === 'Dark' ? '#CDD5DF' : theme === 'Midnight' ? '#C4D4F1' : '#4B5563';
              assert(fill?.toUpperCase() === expected, theme + ' chart label does not use the readable theme colour: ' + fill);
              await mobile.screenshot({ path: 'analytics-' + theme.replaceAll(' ', '-').toLowerCase() + '-mobile.png', fullPage: true });
              await mobile.getByRole('button', { name: 'Settings', exact: true }).click();
            }
            await mobile.screenshot({ path: 'settings-mobile.png', fullPage: true });

            assert(mobileErrors.length === 0, 'Mobile browser runtime errors: ' + mobileErrors.join(' | '));
            await mobile.screenshot({ path: 'student-toolkit-browser-audit-mobile.png', fullPage: true });
            await mobileContext.close();

            await browser.close();
            console.log('Student Toolkit desktop and mobile browser journeys passed.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload browser audit screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: student-toolkit-browser-audit
          path: |
            student-toolkit-browser-audit.png
            student-toolkit-browser-audit-mobile.png
            analytics-desktop.png
            analytics-mobile.png
            analytics-*-mobile.png
            settings-mobile.png
          if-no-files-found: warn
          retention-days: 7
